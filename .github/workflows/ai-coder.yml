name: AI Auto-Coder

on:
  issues:
    types: [opened, edited]

jobs:
  code-and-commit:
    # Only run if the issue title starts with [AI] or contains specific trigger
    if: startsWith(github.event.issue.title, '[AI]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai

      - name: Run AI Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python .github/scripts/generate_code.py

      - name: Commit and Push Changes Directly to Main
        run: |
          git config --global user.name "Gemini Bot"
          git config --global user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Auto-update from issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
            git push origin main
          fi

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Gemini has processed your instructions and pushed the changes directly to `main`! GitHub Pages will update shortly.'
            });
